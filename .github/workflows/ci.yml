name: CI Checks

on:
  push:
    branches: ["main", "dev"]

  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  ci-checks:
    name: CI Checks (Python ${{ matrix.python-version }})
    # Python 3.8 在 ubuntu-24.04+ 上已无法安装（setup-python 报版本不存在），
    # 因此固定到仍提供 3.8 构建的 ubuntu-22.04。
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyyaml

          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e ".[full,dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Lint with flake8
        run: |
          flake8 . --config=.github/.flake8 --count \
            --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Style with flake8
        run: |
          flake8 . --config=.github/.flake8 \
            --count --exit-zero \
            --max-complexity=10 --statistics

      - name: Run unit and integration tests
        run: pytest tests/unit tests/integration
