name: CI Checks

# 触发条件：当有提交推送到 main，或针对 main 分支发起 Pull Request 时触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    # 4. 执行代码规范检查 (Lint)
    - name: Lint with flake8
      run: |
        # 语法错误或未定义变量直接报错终止
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. 执行单元测试 (Test)
    - name: Run tests with pytest
      run: |
        pytest
